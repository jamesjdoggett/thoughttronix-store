<div id="review-empty" {% if oob %}hx-swap-oob="outerHTML"{% endif %}>
  {% if not review_summary.count %}
    <div class="rounded-box border border-dashed border-base-300 p-8 text-center">
      <h3 class="text-xl font-semibold">No reviews yet</h3>
      <p class="mt-2 opacity-70">Purchased this product? Share your experience with the next curious mind.</p>
    </div>
  {% endif %}
</div>
