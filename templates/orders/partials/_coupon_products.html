<fieldset id="coupon-products" class="min-w-0" aria-describedby="id_products_helptext{% if field.errors %} id_products_errors{% endif %}">
  <legend class="text-sm font-medium">{{ field.label }}</legend>
  <p id="id_products_helptext" class="mt-1 text-sm opacity-70">{{ field.help_text }}</p>
  <div class="mt-2 max-h-64 space-y-1 overflow-y-auto rounded-box border border-base-content/20 bg-base-100 p-2">
    {% for choice in field %}
      <label for="{{ choice.id_for_label }}" class="flex min-h-11 cursor-pointer items-start gap-3 rounded-lg px-2 py-2 hover:bg-base-200">
        {{ choice.tag }}
        <span class="min-w-0 whitespace-normal break-words leading-6">{{ choice.choice_label }}</span>
      </label>
    {% empty %}
      <p class="p-2 text-sm opacity-70">No products available. Add a product before creating a product-specific coupon.</p>
    {% endfor %}
  </div>
  {% if field.errors %}
    <div id="id_products_errors" class="mt-1 text-sm text-error" role="alert">
      {% for error in field.errors %}<p>{{ error }}</p>{% endfor %}
    </div>
  {% endif %}
</fieldset>
